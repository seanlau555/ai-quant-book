<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="720" height="220" fill="#fff"/>

  <!-- Title -->
  <text x="360" y="25" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">TRADING AGENT 每日生命週期</text>

  <!-- Timeline axis -->
  <line x1="40" y1="100" x2="680" y2="100" stroke="#ccc" stroke-width="2"/>

  <!-- Time markers and events -->

  <!-- 06:00 Data Update -->
  <line x1="80" y1="90" x2="80" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="80" cy="100" r="6" fill="#f9a8d4" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="130" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">06:00</text>
  <rect x="30" y="45" width="100" height="35" fill="#f9a8d4" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="80" y="67" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="10" font-weight="600" fill="#1a1a1a" text-anchor="middle">數據更新</text>

  <!-- 09:00 Prep -->
  <line x1="200" y1="90" x2="200" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="200" cy="100" r="6" fill="#67e8f9" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="130" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">09:00</text>
  <rect x="150" y="45" width="100" height="35" fill="#67e8f9" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="200" y="67" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="10" font-weight="600" fill="#1a1a1a" text-anchor="middle">開市前</text>

  <!-- 09:30 Execution (highlighted) -->
  <line x1="320" y1="85" x2="320" y2="115" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="320" cy="100" r="8" fill="#5eead4" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="135" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">09:30</text>
  <rect x="265" y="40" width="110" height="40" fill="#5eead4" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <text x="320" y="65" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">執行</text>

  <!-- 15:00 Settlement -->
  <line x1="480" y1="90" x2="480" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="480" cy="100" r="6" fill="#fde047" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="130" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">15:00</text>
  <rect x="430" y="45" width="100" height="35" fill="#fde047" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="480" y="67" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="10" font-weight="600" fill="#1a1a1a" text-anchor="middle">結算</text>

  <!-- 17:00 Analysis -->
  <line x1="600" y1="90" x2="600" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="600" cy="100" r="6" fill="#60a5fa" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="130" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">17:00</text>
  <rect x="550" y="45" width="100" height="35" fill="#60a5fa" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="600" y="67" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="10" font-weight="600" fill="#1a1a1a" text-anchor="middle">分析</text>

  <!-- Detail labels below timeline -->
  <text x="80" y="155" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">下載報價</text>
  <text x="80" y="165" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">更新 feature</text>
  <text x="80" y="175" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">運行預測</text>

  <text x="200" y="155" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">檢查持倉</text>
  <text x="200" y="165" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">計算目標</text>
  <text x="200" y="175" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">產生計劃</text>

  <text x="320" y="155" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">提交訂單</text>
  <text x="320" y="165" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">監察成交</text>
  <text x="320" y="175" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">處理例外</text>

  <text x="480" y="155" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">核對成交</text>
  <text x="480" y="165" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">更新持倉</text>
  <text x="480" y="175" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">產生報告</text>

  <text x="600" y="155" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">評估預測</text>
  <text x="600" y="165" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">檢視執行</text>
  <text x="600" y="175" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="8" fill="#999" text-anchor="middle">記錄問題</text>

  <!-- Trading hours bracket -->
  <path d="M320,188 L320,195 L480,195 L480,188" stroke="#5eead4" stroke-width="1.5" fill="none"/>
  <text x="400" y="210" font-family="'SF Mono', 'Menlo', 'Monaco', monospace" font-size="9" fill="#5eead4" text-anchor="middle">交易時段</text>
</svg>
