<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320">
  <style>
    .title { font: 600 13px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #1a1a1a; }
    .subtitle { font: 500 10px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #666; letter-spacing: 0.5px; }
    .level-title { font: 600 11px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #1a1a1a; }
    .item { font: 500 9px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #1a1a1a; }
    .note { font: 500 10px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #fff; }
  </style>

  <!-- Background -->
  <rect width="620" height="320" fill="#fff"/>

  <!-- Title -->
  <text x="310" y="25" text-anchor="middle" class="title">槓桿控制框架</text>
  <text x="310" y="40" text-anchor="middle" class="subtitle">MULTI-LEVEL LEVERAGE CONSTRAINTS</text>

  <!-- Level 1 -->
  <rect x="30" y="55" width="135" height="115" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" rx="2"/>
  <rect x="30" y="55" width="135" height="25" fill="#60a5fa" rx="2"/>
  <text x="97" y="73" text-anchor="middle" class="note">第 1 級</text>
  <text x="97" y="100" text-anchor="middle" class="level-title">Notional 上限</text>
  <text x="40" y="120" class="item">• 總 notional/資本</text>
  <text x="40" y="135" class="item">  ≤ 3x</text>
  <text x="40" y="155" class="item">• 單一資產類別</text>
  <text x="40" y="170" class="item">  ≤ 2x</text>

  <!-- Level 2 -->
  <rect x="175" y="55" width="135" height="115" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="2"/>
  <rect x="175" y="55" width="135" height="25" fill="#10b981" rx="2"/>
  <text x="242" y="73" text-anchor="middle" class="note">第 2 級</text>
  <text x="242" y="100" text-anchor="middle" class="level-title">風險槓桿</text>
  <text x="185" y="120" class="item">• Portfolio vol / 目標</text>
  <text x="185" y="135" class="item">  ≤ 1.5x</text>
  <text x="185" y="155" class="item">• 壓力測試 vol</text>
  <text x="185" y="170" class="item">  ≤ 2x</text>

  <!-- Level 3 -->
  <rect x="320" y="55" width="135" height="115" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
  <rect x="320" y="55" width="135" height="25" fill="#f59e0b" rx="2"/>
  <text x="387" y="73" text-anchor="middle" class="note">第 3 級</text>
  <text x="387" y="100" text-anchor="middle" class="level-title">保證金緩衝</text>
  <text x="330" y="120" class="item">• 已用保證金</text>
  <text x="330" y="135" class="item">  ≤ 可用額 50%</text>
  <text x="330" y="155" class="item">• 預留 50% 應付</text>
  <text x="330" y="170" class="item">  追加保證金</text>

  <!-- Level 4 -->
  <rect x="465" y="55" width="135" height="115" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="2"/>
  <rect x="465" y="55" width="135" height="25" fill="#ef4444" rx="2"/>
  <text x="532" y="73" text-anchor="middle" class="note">第 4 級</text>
  <text x="532" y="100" text-anchor="middle" class="level-title">壓力情景</text>
  <text x="475" y="120" class="item">• 假設 vol 倍增</text>
  <text x="475" y="135" class="item">  槓桿仍安全</text>
  <text x="475" y="155" class="item">• 假設 corr → 1</text>
  <text x="475" y="170" class="item">  portfolio 能存活</text>

  <!-- Bottom warning -->
  <rect x="30" y="190" width="570" height="115" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,2" rx="2"/>
  <text x="310" y="215" text-anchor="middle" class="level-title">隱藏槓桿警告</text>
  <text x="310" y="240" text-anchor="middle" class="item">Futures portfolio 的 notional 可能遠超資本</text>
  <text x="310" y="260" text-anchor="middle" class="item">$1M 資本 + $6.5M notional = 6.5x 槓桿</text>
  <text x="310" y="280" text-anchor="middle" class="item">低保證金 ≠ 低風險，真正槓桿才是關鍵</text>
  <text x="310" y="300" text-anchor="middle" class="item">Crisis：Vol 倍增 + Corr → 1 = 災難</text>
</svg>
