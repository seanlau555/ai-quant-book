<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320">
  <defs>
    <marker id="arrow-olm-en" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>
    .title { font: 600 13px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #1a1a1a; }
    .subtitle { font: 500 10px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #666; letter-spacing: 0.5px; }
    .mode-title { font: 600 11px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #1a1a1a; }
    .item { font: 500 9px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #1a1a1a; }
    .note { font: 500 10px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #fff; }
    .highlight { font: 500 9px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #10b981; }
  </style>

  <!-- Background -->
  <rect width="620" height="320" fill="#fff"/>

  <!-- Title -->
  <text x="310" y="25" text-anchor="middle" class="title">Online Learning 三種模式</text>
  <text x="310" y="40" text-anchor="middle" class="subtitle">ADAPTIVE MODEL UPDATE STRATEGIES</text>

  <!-- Mode 1: Sliding Window -->
  <rect x="30" y="55" width="180" height="120" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" rx="2"/>
  <rect x="30" y="55" width="180" height="25" fill="#60a5fa" rx="2"/>
  <text x="120" y="73" text-anchor="middle" class="note">模式 1：Sliding Window</text>
  <text x="40" y="98" class="item">最簡單的做法</text>
  <text x="40" y="115" class="item">[ Old ][ Old ][ New ][ New ]</text>
  <text x="40" y="130" class="item">       ↓ 時間推移</text>
  <text x="40" y="145" class="item">[ Old ][ New ][ New ][ Latest ]</text>
  <text x="40" y="165" class="highlight">定期完整重新訓練</text>

  <!-- Mode 2: Incremental Update -->
  <rect x="220" y="55" width="180" height="120" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="2"/>
  <rect x="220" y="55" width="180" height="25" fill="#10b981" rx="2"/>
  <text x="310" y="73" text-anchor="middle" class="note">模式 2：Incremental</text>
  <text x="230" y="98" class="item">效率更高的做法</text>
  <text x="230" y="120" class="item">現有 model θ + 新數據</text>
  <text x="230" y="135" class="item">       ↓</text>
  <text x="230" y="150" class="item">更新後 model θ'</text>
  <text x="230" y="165" class="highlight">微調，不重新訓練</text>

  <!-- Mode 3: Exponential Forgetting -->
  <rect x="410" y="55" width="180" height="120" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
  <rect x="410" y="55" width="180" height="25" fill="#f59e0b" rx="2"/>
  <text x="500" y="73" text-anchor="middle" class="note">模式 3：Exp. Forgetting</text>
  <text x="420" y="98" class="item">最靈活的做法</text>
  <text x="420" y="118" class="item">Weight = λ^(T-t)</text>
  <text x="420" y="138" class="item">λ=0.99：100 日 → 0.37</text>
  <text x="420" y="155" class="item">λ=0.95：100 日 → 0.006</text>
  <text x="420" y="168" class="highlight">λ 細 → 快速遺忘 → 適應</text>

  <!-- Comparison table -->
  <rect x="30" y="190" width="560" height="115" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,2" rx="2"/>
  <text x="310" y="215" text-anchor="middle" class="mode-title">模式選擇指引</text>

  <text x="50" y="240" class="item">Sliding Window：</text>
  <text x="180" y="240" class="item">簡單，適合數據量大而變化慢</text>

  <text x="50" y="260" class="item">Incremental：</text>
  <text x="180" y="260" class="item">高效，適合需要快速適應</text>

  <text x="50" y="280" class="item">Exp. Forgetting：</text>
  <text x="180" y="280" class="item">靈活，透過 λ 控制遺忘速度</text>

  <text x="310" y="298" text-anchor="middle" class="highlight">重點：按市場變化速度選擇衰減因子</text>
</svg>
