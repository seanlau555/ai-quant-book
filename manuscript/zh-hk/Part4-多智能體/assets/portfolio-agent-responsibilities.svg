<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300">
  <style>
    .title { font: 600 13px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #1a1a1a; }
    .subtitle { font: 500 10px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #666; letter-spacing: 0.5px; }
    .resp-title { font: 600 11px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #1a1a1a; }
    .resp-item { font: 500 9px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #1a1a1a; }
    .note { font: 500 10px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #fff; }
  </style>

  <!-- Background -->
  <rect width="620" height="300" fill="#fff"/>

  <!-- Title -->
  <text x="310" y="25" text-anchor="middle" class="title">Portfolio Agent 職責</text>
  <text x="310" y="40" text-anchor="middle" class="subtitle">FOUR CORE FUNCTIONS</text>

  <!-- Responsibility 1 -->
  <rect x="30" y="55" width="135" height="115" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" rx="2"/>
  <rect x="30" y="55" width="135" height="25" fill="#60a5fa" rx="2"/>
  <text x="97" y="73" text-anchor="middle" class="note">功能 1</text>
  <text x="97" y="98" text-anchor="middle" class="resp-title">權重優化</text>
  <text x="40" y="118" class="resp-item">• 接收 signal 強度</text>
  <text x="40" y="133" class="resp-item">• 套用風險約束</text>
  <text x="40" y="148" class="resp-item">• 計算最優權重</text>
  <text x="40" y="163" class="resp-item">• 輸出目標持倉</text>

  <!-- Responsibility 2 -->
  <rect x="175" y="55" width="135" height="115" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="2"/>
  <rect x="175" y="55" width="135" height="25" fill="#10b981" rx="2"/>
  <text x="242" y="73" text-anchor="middle" class="note">功能 2</text>
  <text x="242" y="98" text-anchor="middle" class="resp-title">Factor 監控</text>
  <text x="185" y="118" class="resp-item">• 追蹤 factor 敞口</text>
  <text x="185" y="133" class="resp-item">• 超限時發出警報</text>
  <text x="185" y="148" class="resp-item">• 建議 hedge/rebalance</text>
  <text x="185" y="163" class="resp-item">• 識別隱藏風險</text>

  <!-- Responsibility 3 -->
  <rect x="320" y="55" width="135" height="115" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
  <rect x="320" y="55" width="135" height="25" fill="#f59e0b" rx="2"/>
  <text x="387" y="73" text-anchor="middle" class="note">功能 3</text>
  <text x="387" y="98" text-anchor="middle" class="resp-title">相關性追蹤</text>
  <text x="330" y="118" class="resp-item">• 監控動態相關性</text>
  <text x="330" y="133" class="resp-item">• 偏高時降低權重</text>
  <text x="330" y="148" class="resp-item">• 尋找分散機會</text>
  <text x="330" y="163" class="resp-item">• 危機預警</text>

  <!-- Responsibility 4 -->
  <rect x="465" y="55" width="135" height="115" fill="#67e8f9" stroke="#0891b2" stroke-width="1.5" rx="2"/>
  <rect x="465" y="55" width="135" height="25" fill="#0891b2" rx="2"/>
  <text x="532" y="73" text-anchor="middle" class="note">功能 4</text>
  <text x="532" y="98" text-anchor="middle" class="resp-title">Leverage 管理</text>
  <text x="475" y="118" class="resp-item">• 計算名義/風險槓桿</text>
  <text x="475" y="133" class="resp-item">• 執行 leverage 上限</text>
  <text x="475" y="148" class="resp-item">• 監控 margin buffer</text>
  <text x="475" y="163" class="resp-item">• Stress test 驗證</text>

  <!-- Bottom: Collaboration -->
  <rect x="30" y="185" width="570" height="100" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,2" rx="2"/>
  <text x="310" y="210" text-anchor="middle" class="resp-title">與 Risk Agent 的分工</text>
  <text x="310" y="235" text-anchor="middle" class="resp-item">Portfolio Agent：如何最優配置（交易前規劃）</text>
  <text x="310" y="255" text-anchor="middle" class="resp-item">Risk Agent：是否超出限額（交易中/後審查）</text>
  <text x="310" y="275" text-anchor="middle" class="resp-item">Portfolio 建議 → Risk 審查/削減/拒絕 → Execution 執行</text>
</svg>
