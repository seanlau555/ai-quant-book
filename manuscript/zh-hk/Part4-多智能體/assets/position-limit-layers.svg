<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300">
  <style>
    .title { font: 600 13px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #1a1a1a; }
    .subtitle { font: 500 10px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #666; letter-spacing: 0.5px; }
    .level-title { font: 600 11px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #1a1a1a; }
    .limit { font: 700 12px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #1a1a1a; }
    .desc { font: 500 9px 'SF Mono', 'Menlo', 'Monaco', 'PingFang HK', 'Noto Sans HK', monospace; fill: #666; }
  </style>

  <!-- Background -->
  <rect width="620" height="300" fill="#fff"/>

  <!-- Title -->
  <text x="310" y="25" text-anchor="middle" class="title">倉位限制層級</text>
  <text x="310" y="40" text-anchor="middle" class="subtitle">MULTI-LEVEL POSITION CONSTRAINTS</text>

  <!-- Level 1 -->
  <rect x="30" y="55" width="135" height="115" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" rx="2"/>
  <text x="97" y="75" text-anchor="middle" class="level-title">層級 1</text>
  <text x="97" y="92" text-anchor="middle" class="level-title">單筆交易</text>
  <line x1="45" y1="100" x2="150" y2="100" stroke="#60a5fa" stroke-width="1"/>
  <text x="97" y="120" text-anchor="middle" class="limit">≤ 10%</text>
  <text x="97" y="140" text-anchor="middle" class="desc">每筆交易倉位</text>
  <text x="97" y="155" text-anchor="middle" class="desc">單筆交易不構成威脅</text>

  <!-- Level 2 -->
  <rect x="175" y="55" width="135" height="115" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="2"/>
  <text x="242" y="75" text-anchor="middle" class="level-title">層級 2</text>
  <text x="242" y="92" text-anchor="middle" class="level-title">單一標的</text>
  <line x1="190" y1="100" x2="295" y2="100" stroke="#10b981" stroke-width="1"/>
  <text x="242" y="120" text-anchor="middle" class="limit">≤ 20%</text>
  <text x="242" y="140" text-anchor="middle" class="desc">每個標的合計</text>
  <text x="242" y="155" text-anchor="middle" class="desc">避免單一股票風險</text>

  <!-- Level 3 -->
  <rect x="320" y="55" width="135" height="115" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
  <text x="387" y="75" text-anchor="middle" class="level-title">層級 3</text>
  <text x="387" y="92" text-anchor="middle" class="level-title">行業限額</text>
  <line x1="335" y1="100" x2="440" y2="100" stroke="#f59e0b" stroke-width="1"/>
  <text x="387" y="120" text-anchor="middle" class="limit">≤ 30%</text>
  <text x="387" y="140" text-anchor="middle" class="desc">每個行業敞口</text>
  <text x="387" y="155" text-anchor="middle" class="desc">避免行業集中</text>

  <!-- Level 4 -->
  <rect x="465" y="55" width="135" height="115" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="2"/>
  <text x="532" y="75" text-anchor="middle" class="level-title">層級 4</text>
  <text x="532" y="92" text-anchor="middle" class="level-title">總倉位</text>
  <line x1="480" y1="100" x2="585" y2="100" stroke="#ef4444" stroke-width="1"/>
  <text x="532" y="120" text-anchor="middle" class="limit">≤ 80%</text>
  <text x="532" y="140" text-anchor="middle" class="desc">Portfolio 總敞口</text>
  <text x="532" y="155" text-anchor="middle" class="desc">預留現金應對極端情況</text>

  <!-- Bottom summary -->
  <rect x="30" y="190" width="570" height="95" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,2" rx="2"/>
  <text x="310" y="215" text-anchor="middle" class="level-title">倉位限制金字塔</text>
  <text x="310" y="238" text-anchor="middle" class="desc">單筆 10% → 標的 20% → 行業 30% → 總計 80%</text>
  <text x="310" y="258" text-anchor="middle" class="desc">逐層限額確保單點失誤不致命</text>
  <text x="310" y="278" text-anchor="middle" class="desc">20% 現金儲備 = 最後防線</text>
</svg>
