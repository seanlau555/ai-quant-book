<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <style>
    .title { font: 600 13px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #1a1a1a; }
    .subtitle { font: 500 10px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #666; letter-spacing: 0.5px; }
    .section-title { font: 600 11px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #1a1a1a; }
    .item { font: 500 10px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #1a1a1a; }
    .desc { font: 400 9px 'SF Mono', 'Menlo', 'Monaco', monospace, 'PingFang HK', 'Noto Sans HK'; fill: #666; }
  </style>

  <!-- Background -->
  <rect width="600" height="340" fill="#fff"/>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="title">Regime 偵測評估指標</text>
  <text x="300" y="40" text-anchor="middle" class="subtitle">三個質素維度</text>

  <!-- Section 1: Detection Quality -->
  <rect x="30" y="55" width="170" height="120" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" rx="2"/>
  <text x="115" y="75" text-anchor="middle" class="section-title">1. 偵測質素</text>
  <line x1="45" y1="85" x2="185" y2="85" stroke="#60a5fa" stroke-width="1"/>
  <text x="40" y="105" class="item">狀態持續時間</text>
  <text x="40" y="118" class="desc">每個狀態維持多久？</text>
  <text x="40" y="131" class="desc">太短 = 過度切換</text>
  <text x="40" y="150" class="item">狀態分佈</text>
  <text x="40" y="163" class="desc">比例是否合理？</text>

  <!-- Section 2: Switching Quality -->
  <rect x="215" y="55" width="170" height="120" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
  <text x="300" y="75" text-anchor="middle" class="section-title">2. 切換質素</text>
  <line x1="230" y1="85" x2="370" y2="85" stroke="#f59e0b" stroke-width="1"/>
  <text x="225" y="105" class="item">切換滯後</text>
  <text x="225" y="118" class="desc">由實際轉變</text>
  <text x="225" y="131" class="desc">到偵測的天數</text>
  <text x="225" y="150" class="item">錯誤切換率</text>
  <text x="225" y="163" class="desc">即時逆轉的百分比</text>

  <!-- Section 3: Economic Value -->
  <rect x="400" y="55" width="170" height="120" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="2"/>
  <text x="485" y="75" text-anchor="middle" class="section-title">3. 經濟價值</text>
  <line x1="415" y1="85" x2="555" y2="85" stroke="#10b981" stroke-width="1"/>
  <text x="410" y="105" class="item">有 vs 無</text>
  <text x="410" y="118" class="desc">回報改善</text>
  <text x="410" y="150" class="item">淨增值</text>
  <text x="410" y="163" class="desc">改善 - 切換成本</text>

  <!-- Bottom formula box -->
  <rect x="30" y="195" width="540" height="70" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,2" rx="2"/>
  <text x="300" y="220" text-anchor="middle" class="section-title">重點</text>
  <text x="300" y="240" text-anchor="middle" class="item">Regime 偵測不是目標，提升策略回報才是。</text>
  <text x="300" y="255" text-anchor="middle" class="desc">評估標準：「有否幫策略賺到更多？」</text>

  <!-- Arrow indicators -->
  <rect x="30" y="280" width="540" height="45" fill="#fff" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="50" y="300" class="item">良好偵測：</text>
  <text x="50" y="315" class="desc">持續 > 10 日 | 滯後 &lt; 3 日 | 錯誤率 &lt; 20% | 淨值 > 0</text>
</svg>
